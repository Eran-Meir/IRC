<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise IRC Web Client - mIRC Classic Edition</title>
    <style id="mirc-core-stylesheet">
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f0f0f0;
        --bg-tertiary: #e4e4e4;
        --accent-green: #008000;
        --accent-cyan: #000080;
        --accent-gold: #000000;
        --accent-magenta: #800080;
        --text-main: #000000;
        --text-muted: #555555;
        --text-notice: #008000;
        --border-color: #c0c0c0;
        --font-family: 'Fira Code', 'Courier New', Consolas, monospace;
        --font-size: 14px;
        --dir: ltr;
      }

      [data-theme="mirc-dark"] {
        --bg-primary: #0f111a;
        --bg-secondary: #181a26;
        --bg-tertiary: #212436;
        --accent-green: #00ff66;
        --accent-cyan: #00e5ff;
        --accent-gold: #ffcc00;
        --accent-magenta: #ff007f;
        --text-main: #e0e6ed;
        --text-muted: #8a94a6;
        --text-notice: #70a1ff;
        --border-color: #2b304a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-main);
        font-family: var(--font-family);
        font-size: var(--font-size);
        direction: var(--dir);
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background-color: var(--bg-primary);
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 36px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
        padding: 0 12px;
        z-index: 100;
        font-size: 13px;
      }

      .menu-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-badge {
        font-weight: bold;
        color: var(--text-main);
        padding-right: 12px;
        border-right: 1px solid var(--border-color);
      }

      .theme-toggle-btn, .menu-btn {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        padding: 4px 10px;
        cursor: pointer;
        border-radius: 3px;
      }

      .theme-toggle-btn:hover, .menu-btn:hover {
        background: #ffffff;
        color: #000000;
        border-color: #000000;
      }

      .main-layout {
        display: flex;
        flex: 1;
        height: calc(100vh - 85px);
        overflow: hidden;
      }

      .sidebar {
        width: 210px;
        background-color: var(--bg-secondary);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        user-select: none;
      }

      .sidebar-header {
        padding: 8px 12px;
        font-weight: bold;
        font-size: 11px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      .sidebar-tree {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      .tree-item {
        display: flex;
        align-items: center;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        border-radius: 2px;
        margin: 1px 4px;
      }

      .tree-item:hover {
        background-color: var(--bg-tertiary);
      }

      .tree-item.active {
        background-color: #000080;
        color: #ffffff !important;
        font-weight: bold;
      }

      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-primary);
        height: 100%;
        overflow: hidden;
      }

      .chat-header {
        padding: 8px 14px;
        background-color: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: bold;
      }

      .message-stream {
        flex: 1;
        padding: 12px 16px;
        overflow-y: auto;
        font-family: var(--font-family);
        line-height: 1.5;
        font-size: 14px;
      }

      .msg-line {
        margin-bottom: 4px;
        word-break: break-word;
      }

      .timestamp {
        color: var(--text-muted);
        margin-right: 8px;
        font-size: 12px;
      }

      .system-text {
        color: #008000;
        font-weight: bold;
      }

      .chatops-text {
        color: #a52a2a;
        font-weight: bold;
      }

      .whois-text {
        color: var(--text-main);
      }

      /* Interactive Clickable Channel Links e.g. #kkk */
      .channel-link {
        color: #000080;
        font-weight: bold;
        cursor: pointer;
        text-decoration: underline;
        padding: 0 2px;
        border-radius: 2px;
      }

      .channel-link:hover {
        color: #008000;
        background-color: rgba(0, 0, 128, 0.1);
      }

      /* User List Sidebar — Pure Black Nicknames in Light Mode */
      .user-list {
        width: 180px;
        background-color: var(--bg-primary);
        border-left: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
      }

      .user-list-header {
        padding: 8px 12px;
        font-weight: bold;
        font-size: 11px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      .user-items {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      .user-item {
        padding: 4px 10px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .user-item:hover {
        background-color: var(--bg-secondary);
      }

      .user-badge {
        width: 16px;
        font-weight: bold;
        display: inline-block;
      }

      .user-badge.op { color: #d4af37; }
      .user-badge.protected { color: #cc0044; }
      .user-badge.voice { color: #b8860b; }

      /* Force User List Nicknames to Pure Black in Light Mode */
      .user-nick,
      .user-nick.op,
      .user-nick.protected,
      .user-nick.voice,
      .user-nick.normal {
        color: #000000 !important;
        font-weight: normal;
      }

      [data-theme="mirc-dark"] .user-nick,
      [data-theme="mirc-dark"] .user-nick.normal {
        color: #e0e6ed !important;
      }

      /* Bottom Message Input Bar — Large Crisp Text */
      .message-input-bar, .message-input-container {
        display: flex;
        padding: 8px 12px;
        background-color: var(--bg-tertiary);
        border-top: 1px solid var(--border-color);
        gap: 8px;
        align-items: center;
      }

      .input-form {
        display: flex;
        flex: 1;
        gap: 8px;
        align-items: center;
      }

      .target-pill {
        font-weight: bold;
        font-size: 13px;
        padding: 6px 10px;
        background-color: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      .chat-input {
        flex: 1;
        background-color: var(--bg-primary);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 8px 12px;
        font-family: var(--font-family);
        font-size: 16px !important;
        line-height: 1.4;
        outline: none;
        min-height: 42px;
        resize: none;
      }

      .send-btn {
        background-color: var(--bg-secondary);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 8px 18px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        min-height: 42px;
      }

      .send-btn:hover {
        background-color: #000080;
        color: #ffffff;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .modal-content {
        background-color: var(--bg-secondary);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        width: 90%;
        max-width: 540px;
        overflow: hidden;
        z-index: 10000;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
      }

      .modal-body { padding: 16px; }
      .modal-footer { padding: 10px 16px; background-color: var(--bg-tertiary); display: flex; justify-content: flex-end; }
      .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
      .secondary-btn { padding: 6px 14px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; }
      .add-ban-btn { background: #008000; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
      .ban-input { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 10px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
