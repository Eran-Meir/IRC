<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mIRC v7.78 Web Edition - Enterprise IRC Client</title>
    <style id="mirc-core-stylesheet">
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #e4e4e4;
        --bg-tertiary: #d4d0c8;
        --accent-green: #008000;
        --accent-cyan: #000080;
        --accent-gold: #000000;
        --accent-magenta: #800080;
        --text-main: #000000;
        --text-muted: #444444;
        --text-notice: #008000;
        --border-color: #a0a0a0;
        --font-family: 'Fira Code', 'Courier New', Consolas, monospace;
        --font-size: 14px;
        --dir: ltr;
      }

      [data-theme="mirc-dark"] {
        --bg-primary: #0f111a;
        --bg-secondary: #181a26;
        --bg-tertiary: #212436;
        --accent-green: #00ff66;
        --accent-cyan: #00e5ff;
        --accent-gold: #ffcc00;
        --accent-magenta: #ff007f;
        --text-main: #e0e6ed;
        --text-muted: #8a94a6;
        --text-notice: #70a1ff;
        --border-color: #2b304a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-main);
        font-family: var(--font-family);
        font-size: var(--font-size);
        direction: var(--dir);
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background-color: var(--bg-primary);
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 34px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
        padding: 0 10px;
        z-index: 100;
        font-size: 12px;
      }

      .menu-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-badge {
        font-weight: bold;
        color: var(--text-main);
        padding-right: 10px;
        border-right: 1px solid var(--border-color);
      }

      .theme-toggle-btn, .menu-btn {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        font-family: inherit;
        font-size: 12px;
        padding: 2px 8px;
        cursor: pointer;
        border-radius: 2px;
      }

      .theme-toggle-btn:hover, .menu-btn:hover {
        background: #ffffff;
        color: #000000;
      }

      .main-layout {
        display: flex;
        flex: 1;
        height: calc(100vh - 70px);
        overflow: hidden;
      }

      .sidebar {
        width: 200px;
        background-color: var(--bg-secondary);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        user-select: none;
      }

      .sidebar-header {
        padding: 6px 10px;
        font-weight: bold;
        font-size: 11px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
        color: var(--text-muted);
      }

      .sidebar-tree {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      .tree-item {
        display: flex;
        align-items: center;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 13px;
      }

      .tree-item:hover {
        background-color: var(--bg-tertiary);
      }

      .tree-item.active {
        background-color: #000080;
        color: #ffffff;
        font-weight: bold;
      }

      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-primary);
        height: 100%;
        overflow: hidden;
      }

      .chat-header {
        padding: 6px 12px;
        background-color: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
      }

      .message-stream {
        flex: 1;
        padding: 10px 14px;
        overflow-y: auto;
        font-family: var(--font-family);
        line-height: 1.4;
      }

      .msg-line {
        margin-bottom: 3px;
        word-break: break-word;
      }

      .timestamp {
        color: var(--text-muted);
        margin-right: 8px;
        font-size: 12px;
      }

      .system-text {
        color: #008000;
        font-weight: bold;
      }

      .chatops-text {
        color: #a52a2a;
        font-weight: bold;
      }

      .whois-text {
        color: var(--text-main);
      }

      .user-list {
        width: 170px;
        background-color: var(--bg-primary);
        border-left: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
      }

      .user-list-header {
        padding: 6px 10px;
        font-weight: bold;
        font-size: 11px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
        color: var(--text-muted);
      }

      .user-items {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      .user-item {
        padding: 2px 8px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .user-item:hover {
        background-color: var(--bg-secondary);
      }

      .user-badge {
        width: 14px;
        font-weight: bold;
      }

      .user-nick.op, .user-badge.op { color: #d4af37; font-weight: bold; }
      .user-nick.protected, .user-badge.protected { color: #cc0044; font-weight: bold; }
      .user-nick.voice, .user-badge.voice { color: #b8860b; font-weight: bold; }
      .user-nick.normal { color: var(--text-main); }

      .message-input-container {
        display: flex;
        padding: 6px;
        background-color: var(--bg-tertiary);
        border-top: 1px solid var(--border-color);
        gap: 6px;
      }

      .chat-input {
        flex: 1;
        background-color: var(--bg-primary);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 4px 8px;
        font-family: var(--font-family);
        font-size: 14px;
        outline: none;
      }

      .send-btn {
        background-color: var(--bg-secondary);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 4px 12px;
        cursor: pointer;
        font-weight: bold;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .modal-content {
        background-color: var(--bg-secondary);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        width: 90%;
        max-width: 520px;
        overflow: hidden;
        z-index: 10000;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background-color: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-color);
      }

      .modal-body { padding: 14px; }
      .modal-footer { padding: 8px 14px; background-color: var(--bg-tertiary); display: flex; justify-content: flex-end; }
      .close-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
      .secondary-btn { padding: 4px 12px; border: 1px solid var(--border-color); cursor: pointer; }
      .add-ban-btn { background: #008000; color: #fff; border: none; padding: 4px 12px; cursor: pointer; }
      .ban-input { width: 100%; padding: 6px; border: 1px solid var(--border-color); margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
