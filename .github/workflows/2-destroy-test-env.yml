name: 2. Destroy Test Environment
on:
  workflow_dispatch:

jobs:
  destroy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write OCI Key File
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.OCI_TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={ s3 = \"https://${{ secrets.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com\" }" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"
        working-directory: terraform/environments/test

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var="tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" \
            -var="user_ocid=${{ secrets.OCI_USER_OCID }}" \
            -var="fingerprint=${{ secrets.OCI_FINGERPRINT }}" \
            -var="private_key=${{ secrets.OCI_PRIVATE_KEY }}" \
            -var="region=${{ secrets.OCI_REGION }}" \
            -var="compartment_ocid=${{ secrets.OCI_COMPARTMENT_OCID }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"
        working-directory: terraform/environments/test
