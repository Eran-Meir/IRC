name: 3. Deploy to Test & Run Integration
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/eran-meir/irc/ircd

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Build the Docker image and push to GHCR
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Go IRCd (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: ./services/ircd
          file: ./services/ircd/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # ─────────────────────────────────────────────────────────
  # Job 2: Deploy manifests to Oracle Cloud K3s cluster
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to K3s
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write OCI Key File
        run: |
          cat << 'EOF' > terraform/environments/test/api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

      - name: Get Server IP and SSH Key from Terraform State
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.OCI_TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={ s3 = \"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com\" }" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"
          
          SERVER_IP=$(terraform output -raw server_public_ip)
          echo "Dynamically fetched Server IP: $SERVER_IP"
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_ENV
          
          # Fetch the auto-generated SSH private key from Terraform state
          mkdir -p $HOME/.ssh
          terraform output -raw ssh_private_key > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key
        working-directory: terraform/environments/test

      - name: Copy Manifests to Server
        run: |
          scp -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key \
            -r services/ircd/deploy ubuntu@${SERVER_IP}:~/deploy

      - name: Apply Kubernetes Manifests
        run: |
          ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key ubuntu@${SERVER_IP} " \
            sed -i 's|${{ env.IMAGE_NAME }}:latest|${{ env.IMAGE_NAME }}:${{ github.sha }}|g' ~/deploy/deployment.yaml && \
            sudo kubectl apply -f ~/deploy/valkey.yaml && \
            sudo kubectl apply -f ~/deploy/deployment.yaml && \
            sudo kubectl apply -f ~/deploy/service.yaml \
          "

  # ─────────────────────────────────────────────────────────
  # Job 3: Verify the deployment is healthy
  # ─────────────────────────────────────────────────────────
  verify:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write OCI Key File
        run: |
          cat << 'EOF' > terraform/environments/test/api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

      - name: Get Server IP from Terraform State
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.OCI_TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={ s3 = \"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com\" }" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"
          
          SERVER_IP=$(terraform output -raw server_public_ip)
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_ENV
        working-directory: terraform/environments/test

      - name: Wait for Pod Rollout
        run: sleep 30

      - name: Verify IRC Server Responds
        run: |
          echo "Connecting to IRC server at ${SERVER_IP}:6667..."
          RESPONSE=$(echo "" | nc -w 5 ${SERVER_IP} 6667 || true)
          echo "Server responded: $RESPONSE"
          if echo "$RESPONSE" | grep -q "Version"; then
            echo "✅ Smoke test PASSED — Server is alive and responding!"
          else
            echo "❌ Smoke test FAILED — No valid response from server."
            exit 1
          fi
