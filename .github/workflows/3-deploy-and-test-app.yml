name: 3. Deploy to Test & Run Integration
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Go IRCd (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: ./services/ircd
          file: ./services/ircd/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/eran-meir/irc/ircd:${{ github.sha }}

      - name: Write SSH Key
        run: |
          cat << 'EOF' > private_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 private_key.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Get Server IP from Terraform State
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.OCI_TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={ s3 = \"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com\" }" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"
          
          SERVER_IP=$(terraform output -raw server_public_ip)
          echo "Dynamically fetched Server IP: $SERVER_IP"
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_ENV
        working-directory: terraform/environments/test

      - name: Deploy to K3s Cluster via SSH
        run: |
          # Copy manifests to the server
          scp -o StrictHostKeyChecking=no -i private_key.pem -r services/ircd/deploy ubuntu@${SERVER_IP}:~/deploy
          
          # Replace the image tag in deployment.yaml and apply
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${SERVER_IP} " \
            sed -i 's|ghcr.io/eran-meir/irc/ircd:latest|ghcr.io/eran-meir/irc/ircd:${{ github.sha }}|g' ~/deploy/deployment.yaml && \
            kubectl apply -f ~/deploy/valkey.yaml && \
            kubectl apply -f ~/deploy/deployment.yaml && \
            kubectl apply -f ~/deploy/service.yaml \
          "
