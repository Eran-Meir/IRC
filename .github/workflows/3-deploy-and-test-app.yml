name: 3. Deploy to Test & Run Integration
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Go IRCd (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/ircd/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/ircd:${{ github.sha }}

      # Note: In the next phase, we will add the ArgoCD / Kubectl steps 
      # here to deploy this image to the Test cluster and run the cross-pod test.
