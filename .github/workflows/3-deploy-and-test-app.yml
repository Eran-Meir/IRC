name: 3. Deploy to Test & Run Integration
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Go IRCd (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/ircd/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/ircd:${{ github.sha }}

      - name: Write SSH Key
        run: |
          cat << 'EOF' > private_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 private_key.pem

      - name: Deploy to K3s Cluster via SSH
        env:
          SERVER_IP: ${{ vars.TEST_SERVER_IP }} # We need to get this from somewhere, or output it
        run: |
          # Copy manifests to the server
          scp -o StrictHostKeyChecking=no -i private_key.pem -r services/ircd/deploy ubuntu@${SERVER_IP}:~/deploy
          
          # Replace the image tag in deployment.yaml and apply
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${SERVER_IP} " \
            sed -i 's|ghcr.io/Eran-Meir/IRC/ircd:latest|ghcr.io/Eran-Meir/IRC/ircd:${{ github.sha }}|g' ~/deploy/deployment.yaml && \
            kubectl apply -f ~/deploy/valkey.yaml && \
            kubectl apply -f ~/deploy/deployment.yaml && \
            kubectl apply -f ~/deploy/service.yaml \
          "
