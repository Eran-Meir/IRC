name: 1. Provision Test Environment
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Initialize Terraform and generate a plan
  # ─────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Write OCI Key File
        run: |
          cat << 'EOF' > terraform/environments/test/api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

      - name: Terraform Init
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.OCI_TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={ s3 = \"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com\" }" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"
        working-directory: terraform/environments/test

      - name: Terraform Plan
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform plan \
            -var="tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" \
            -var="user_ocid=${{ secrets.OCI_USER_OCID }}" \
            -var="fingerprint=${{ secrets.OCI_FINGERPRINT }}" \
            -var="region=${{ secrets.OCI_REGION }}" \
            -var="compartment_ocid=${{ secrets.OCI_COMPARTMENT_OCID }}" \
            -out=tfplan
        working-directory: terraform/environments/test

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: |
            terraform/environments/test/tfplan
            terraform/environments/test/api_key.pem

  # ─────────────────────────────────────────────────────────
  # Job 2: Apply the approved plan
  # ─────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v6
        with:
          name: tfplan
          path: terraform/environments/test

      - name: Terraform Init
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.OCI_TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={ s3 = \"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com\" }" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"
        working-directory: terraform/environments/test

      - name: Terraform Apply
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform apply tfplan
        working-directory: terraform/environments/test

      - name: Show Outputs
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          echo "=== Infrastructure Outputs ==="
          terraform output
        working-directory: terraform/environments/test
