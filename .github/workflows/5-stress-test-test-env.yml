name: 5. Stress Test - Test Environment
on:
  workflow_dispatch:
    inputs:
      num_clients:
        description: 'Number of concurrent TCP clients'
        required: false
        default: '50'
      duration_seconds:
        description: 'Test duration in seconds'
        required: false
        default: '45'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stress-test:
    name: Run IRC Daemon Load & Stress Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure OCI & S3 Credentials for Terraform
        env:
          OCI_PEM_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          
          cat <<EOF > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

      - name: Fetch Server IP from Terraform State
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.OCI_TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoints={ s3 = \"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com\" }" \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}"
          
          SERVER_IP=$(terraform output -raw server_public_ip)
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_ENV
        working-directory: terraform/environments/test

      - name: Execute High-Concurrency Stress Test
        run: |
          echo "Connecting to IRC Server at ${SERVER_IP}:6667..."
          python scripts/stress_test.py ${SERVER_IP} \
            --clients ${{ github.event.inputs.num_clients || 50 }} \
            --duration ${{ github.event.inputs.duration_seconds || 45 }}
