apiVersion: apps/v1
kind: Deployment
metadata:
  name: ircd
  labels:
    app: ircd
spec:
  replicas: 1 # Will increase in prod
  selector:
    matchLabels:
      app: ircd
  template:
    metadata:
      labels:
        app: ircd
    spec:
      containers:
      - name: ircd
        # The tag will be dynamically substituted by GitHub Actions using sed before apply
        image: ghcr.io/eran-meir/irc/ircd:0775ab0fb880775e75f1b762ba8c65873708e2f9
        imagePullPolicy: Always
        ports:
        - containerPort: 6667
        env:
        - name: VALKEY_URL
          value: "valkey:6379"
