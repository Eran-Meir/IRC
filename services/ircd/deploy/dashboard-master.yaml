apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-master
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  master-overview.json: |-
    {
      "title": "🚀 Master System Overview (Server + Application)",
      "tags": ["master", "executive", "overview"],
      "timezone": "browser",
      "refresh": "5s",
      "panels": [
        {
          "type": "stat",
          "title": "System Node Health",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "count(up{job=~\".*node-exporter.*\"} == 1) or vector(1)",
              "legendFormat": "Node Online"
            }
          ]
        },
        {
          "type": "stat",
          "title": "IRCd Pod Status",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\", pod=~\"ircd-.*\", pod!~\"ircd-web-client.*\"}) or vector(1)",
              "legendFormat": "IRCd Pods Running"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Valkey Pod Status",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\", pod=~\"valkey-.*\"}) or vector(1)",
              "legendFormat": "Valkey Pods Running"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Active IRC Connections",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(ircd_connected_clients) or vector(0)",
              "legendFormat": "Connected IRC Clients"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Server Node CPU & Memory Usage",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "decbytes" } },
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)",
              "legendFormat": "Node CPU (%)"
            },
            {
              "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",
              "legendFormat": "Node Used RAM"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "IRCd & Valkey App CPU & Memory Usage",
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "decbytes" } },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container=\"ircd\"}[2m])) * 100",
              "legendFormat": "IRCd CPU (%)"
            },
            {
              "expr": "sum(container_memory_usage_bytes{container=\"ircd\"})",
              "legendFormat": "IRCd RAM"
            },
            {
              "expr": "sum(container_memory_usage_bytes{container=\"valkey\"})",
              "legendFormat": "Valkey RAM"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Server Node Network Bandwidth",
          "gridPos": { "x": 0, "y": 13, "w": 24, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{device!~\"lo|veth.*\"}[2m])",
              "legendFormat": "Inbound Bandwidth ({{device}})"
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{device!~\"lo|veth.*\"}[2m])",
              "legendFormat": "Outbound Bandwidth ({{device}})"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Loki Stream: Unified System & App Moderation Logs",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"ircd\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 30
    }
