apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-master
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  master-overview.json: |-
    {
      "title": "🚀 Master System Overview (Server + Application)",
      "tags": ["master", "executive", "overview"],
      "timezone": "browser",
      "refresh": "5s",
      "panels": [
        {
          "type": "stat",
          "title": "System Node Health",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 6 },
          "targets": [
            {
              "expr": "up{job=\"node-exporter\"} or vector(1)",
              "legendFormat": "Node Online"
            }
          ]
        },
        {
          "type": "stat",
          "title": "IRCd Container Status",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 6 },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\", pod=~\"ircd-.*\"}) or vector(1)",
              "legendFormat": "IRCd Pods Running"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Valkey Backend Status",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 6 },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\", pod=~\"valkey-.*\"}) or vector(1)",
              "legendFormat": "Valkey Pods Running"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Server Node CPU & Memory Usage",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)",
              "legendFormat": "Node CPU (%)"
            },
            {
              "expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / 1024 / 1024 / 1024",
              "legendFormat": "Node Used RAM (GB)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "IRCd App CPU & Memory Usage",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container=\"ircd\"}[2m])) * 100",
              "legendFormat": "IRCd CPU (%)"
            },
            {
              "expr": "sum(container_memory_usage_bytes{container=\"ircd\"}) / 1024 / 1024",
              "legendFormat": "IRCd RAM (MB)"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Loki Stream: Unified System & App Moderation Logs",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"ircd\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 30
    }
