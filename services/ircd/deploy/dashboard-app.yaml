apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  app-overview.json: |-
    {
      "title": "💬 IRC Application & Services Overview",
      "tags": ["ircd", "application", "services"],
      "timezone": "browser",
      "refresh": "5s",
      "panels": [
        {
          "type": "stat",
          "title": "Established TCP Sockets",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(node_netstat_Tcp_CurrEstab) or vector(0)",
              "legendFormat": "Established TCP Connections"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "IRCd Container CPU Usage",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container=\"ircd\"}[2m])) * 100",
              "legendFormat": "IRCd CPU (%)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "IRCd & Valkey Memory Usage",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "decbytes" } },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{container=\"ircd\"})",
              "legendFormat": "IRCd Memory"
            },
            {
              "expr": "sum(container_memory_usage_bytes{container=\"valkey\"})",
              "legendFormat": "Valkey Memory"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "IRC Container Network Throughput",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            {
              "expr": "rate(container_network_receive_bytes_total{container=\"ircd\"}[2m])",
              "legendFormat": "Inbound Throughput"
            },
            {
              "expr": "rate(container_network_transmit_bytes_total{container=\"ircd\"}[2m])",
              "legendFormat": "Outbound Throughput"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Loki Stream: IRC Daemon & Services Logs",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"ircd\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 30
    }
