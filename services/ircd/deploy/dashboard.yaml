apiVersion: v1
kind: ConfigMap
metadata:
  name: ircd-dashboard
  namespace: default
  labels:
    # This label tells the Grafana Sidecar to automatically import this dashboard!
    grafana_dashboard: "1"
data:
  ircd-overview.json: |-
    {
      "title": "🚀 IRC Daemon (Live App Metrics)",
      "tags": ["ircd", "production"],
      "timezone": "browser",
      "refresh": "5s",
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU Usage (Cores)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"default\", pod=~\"ircd-.*\"}[2m])",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory Usage (Bytes)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "container_memory_usage_bytes{namespace=\"default\", pod=~\"ircd-.*\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Network Traffic (Bytes/sec) - Proxy for TCP Load",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "rate(container_network_receive_bytes_total{namespace=\"default\", pod=~\"ircd-.*\"}[2m])",
              "legendFormat": "Inbound Traffic ({{pod}})"
            },
            {
              "expr": "rate(container_network_transmit_bytes_total{namespace=\"default\", pod=~\"ircd-.*\"}[2m])",
              "legendFormat": "Outbound Traffic ({{pod}})"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Loki Stream: Live Moderation & System Logs",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"ircd\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 30
    }
