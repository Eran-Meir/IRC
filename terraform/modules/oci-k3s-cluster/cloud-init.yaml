#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - wget

runcmd:
  # Open firewall ports on the Ubuntu OS itself (Oracle has netfilter REJECT rules on FORWARD by default which breaks k3s ingress/LoadBalancer)
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -F INPUT
  - iptables -F FORWARD
  - iptables -I INPUT -p tcp -m tcp --dport 6667 -j ACCEPT
  - iptables -I INPUT -p tcp -m tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp -m tcp --dport 443 -j ACCEPT
  - iptables -I INPUT -p tcp -m tcp --dport 3000 -j ACCEPT
  - iptables -I INPUT -p tcp -m tcp --dport 6443 -j ACCEPT
  - iptables -I INPUT -p udp -m udp --dport 8472 -j ACCEPT
  - netfilter-persistent save

  # Install k3s with world-readable kubeconfig so the ubuntu user can run kubectl without sudo
  - curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644

  # Wait for k3s to be ready
  - sleep 15

  # Install ArgoCD
  - export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
  - kubectl create namespace argocd
  - kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

  # Wait for ArgoCD CRDs to be established before creating the Application
  - sleep 15

  # Bootstrap the IRCd application via ArgoCD Application CRD
  - |
    cat <<EOF | kubectl apply -f -
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: ircd
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: 'https://github.com/Eran-Meir/IRC.git'
        path: services/ircd/deploy
        targetRevision: HEAD
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    EOF

  # Bootstrap Observability & Monitoring Stack
  - kubectl create namespace monitoring || true
  - |
    if [ -n "${grafana_admin_password}" ]; then
      kubectl create secret generic grafana-admin-secret -n monitoring --from-literal=admin-user=admin --from-literal=admin-password="${grafana_admin_password}" --dry-run=client -o yaml | kubectl apply -f -
    fi
  - kubectl apply -f https://raw.githubusercontent.com/Eran-Meir/IRC/main/infrastructure/monitoring/kube-prometheus-stack.yaml
  - kubectl apply -f https://raw.githubusercontent.com/Eran-Meir/IRC/main/infrastructure/monitoring/loki-stack.yaml
